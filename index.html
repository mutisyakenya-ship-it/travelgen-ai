<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

  //Favicon 
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    // Mobile 
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    //Font preconnect + stylesheet 
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    //Hero image preload (LCP element) 
    <link rel="preload" as="image" href="/hero.jpg" fetchpriority="high" />

    //Primary SEO 
    <title>TravelGen AI | AI-Powered Travel Planner</title>
    <meta
      name="description"
      content="TravelGen AI helps you plan personalized trips using artificial intelligence. Discover destinations, hotels, restaurants, attractions, transport, and budgets in seconds."
    />

    <meta
      name="keywords"
      content="TravelGen AI, AI Travel Planner, Kenya Travel, Safari, Travel Itinerary, Hotels, Restaurants, Tourism, Gemini AI"
    />

    <meta
      name="author"
      content="Ambrose Mutisya"
    />

    <meta
      name="robots"
      content="index, follow"
    />

    //Canonical URL 
    <link
      rel="canonical"
      href="https://travelgen-ai-ochre.vercel.app/"
    />

    // Open Graph 
    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:title"
      content="TravelGen AI | AI-Powered Travel Planner"
    />

    <meta
      property="og:description"
      content="Create personalized AI-powered travel itineraries with hotels, attractions, restaurants, transport and budgets."
    />

    <meta
      property="og:url"
      content="https://travelgen-ai-ochre.vercel.app/"
    />

    <meta
      property="og:image"
      content="https://travelgen-ai-ochre.vercel.app/hero.jpg"
    />

    // Twitter 
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="TravelGen AI"
    />

    <meta
      name="twitter:description"
      content="Plan smarter trips with AI."
    />

    <meta
      name="twitter:image"
      content="https://travelgen-ai-ochre.vercel.app/hero.jpg"
    />
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
